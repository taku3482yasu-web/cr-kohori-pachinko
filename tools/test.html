<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>盤面テスト</title>
<!--
    盤面の物理テスト。打ち出しの強さごとに玉を打って、どこに入ったかを数える。
    ブラウザで開くか、ヘッドレスChromeで:
      chrome --headless --disable-gpu --virtual-time-budget=60000 --dump-dom tools/test.html
    ?balls=500 で強さごとの玉の数、?seed=1 で乱数の種を変えられる。
-->
<style>body { font: 13px monospace; background: #111; color: #ddd; } td, th { padding: 2px 8px; text-align: right; }</style>
</head>
<body>
<pre id="out">計算中…</pre>
<script src="../js/config.js"></script>
<script src="../js/board.js"></script>
<script src="../js/physics.js"></script>
<script>
(() => {
    const params = new URLSearchParams(location.search);
    const BALLS = Number(params.get('balls') || 300);
    let seed = Number(params.get('seed') || 20261019);
    const rng = () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    // 1発ずつ、玉がなくなるまで計算する。起きたことの一覧を返す
    function shoot(board, strength, opened) {
        const world = { board, balls: [], rng, events: [] };
        Object.keys(board.parts).forEach(id => Board.setOpen(board, id, opened));
        const ball = Physics.launch(world, strength, CONFIG);
        let landX = null;
        for (let t = 0; t < 20 && world.balls.length; t += 1 / 60) {
            Physics.step(world, 1 / 60, CONFIG);
            // 天釘の高さを下向きに通りすぎたところ = 落ちてきた位置
            if (landX === null && ball.vy > 0 && ball.y > 100 && ball.y < 120 && ball.x > 32) landX = ball.x;
        }
        if (world.balls.length) world.events.push({ type: 'timeout', x: ball.x, y: ball.y });
        return { events: world.events, landX };
    }

    const lines = [];
    const board = Board.build(CONFIG);
    lines.push(`釘 ${board.nails.length} 本 / 玉 ${BALLS} 発ずつ\n`);
    const cols = ['foul', 'heso', 'general', 'gate', 'denchu', 'attacker', 'warp', 'spill', 'stuck', 'timeout'];
    lines.push('強さ  ' + cols.map(c => c.padStart(8)).join('') + '   落下位置(平均)');
    const started = performance.now();
    const where = [];   // 止まった・時間切れの玉の位置 (はじめの数個)
    const report = (label, opened) => {
        lines.push(`--- ${label} ---`);
        for (let s = 0; s <= 100; s += 10) {
            const count = Object.fromEntries(cols.map(c => [c, 0]));
            const lands = [];
            for (let i = 0; i < BALLS; i++) {
                const { events, landX } = shoot(board, s, opened);
                if (landX !== null) lands.push(landX);
                events.forEach(e => {
                    if ((e.type === 'timeout' || e.stuck) && where.length < 12) where.push(`${e.type === 'timeout' ? 'T' : 'S'}(${e.x.toFixed(0)},${e.y.toFixed(0)})`);
                    const key = e.type === 'pocket' ? (e.payout === 'general' ? 'general' : e.id) : e.stuck ? 'stuck' : e.type;
                    if (key in count) count[key]++;
                });
            }
            const avg = lands.length ? (lands.reduce((a, x) => a + x, 0) / lands.length).toFixed(0) : '-';
            lines.push(String(s).padStart(4) + '  ' + cols.map(c => (count[c] / BALLS * 100).toFixed(1).padStart(8)).join('') + '   ' + avg);
        }
    };
    report('電チュー・アタッカー 閉', false);
    if (params.get('open') !== '0') report('電チュー・アタッカー 開', true);
    if (where.length) lines.push('\n止まった玉 (S)・時間切れ (T) の位置: ' + where.join(' '));
    lines.push(`\n(単位は %。${((performance.now() - started) / 1000).toFixed(1)} 秒)`);
    document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body>
</html>
