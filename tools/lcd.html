<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>液晶の確認</title>
<!--
    液晶だけを大きく表示して、変動の流れを確認する (盤面・玉はなし)。
    ?force=hit|rush|reach|fail|small  はじめの保留 / &enemy=onioni バトルの相手 / &spec=s159
    ?force=challenge&win=2  突破チャレンジ (保留4つ、win 番目で当たり。-1 で負け)
    ?force=koori&enemy=goldDog&lose=1  こおりRASH のバトル (lose=1 でガセのバトル)
    ?force=onioni&pattern=zoom  おにおにRASH の当たり (open / rainbow / flip / upsideDown / mono / zoom / koori / tomoishi / naitei)
    &rashhold=black (または spin)  RASH 中の当たりの保留を黒い保留・回る保留に (残り保留に1つ足す)
    ?force=blackout  RASH 中のブラックアウト (突発当たり)
    ?story=opening / ?story=ending  オープニング・エンディング
    ?force=rush&promote=1&fast=1  奇数の当たりを偶数で見せて、ラウンド中に昇格
    ?force=renchan&mode=onioni&fast=1  RASH の大当たり中に残り保留の当たりで「〇G連確定！」(&pos=2 で2つ目の保留)
    ?force=koori&hit=3&fast=1  こおりRASH で特図2 の大当たり (3連目) → 大当たり → 「〇回目」→「〇〇RASH」
    &t=12 その秒数まで早送りした画面で止める (ヘッドレスChromeで画像にするとき)。t がなければふつうに動く
    &ts=2,6,12 その秒数ごとの画面を並べる (1回の変動を何枚かで見る)
    &holds=3 ほかの保留の数 / &color=rainbow はじめの保留の色 / &challenge=music チャレンジの種類
    &change=self (または next) はじめの保留を白から変化させる (当該変化 / 保留が進むとき)
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
    body { margin: 0; background: #111; color: #ccc; font: 13px monospace; }
    canvas { display: block; width: 768px; height: 432px; image-rendering: pixelated; }
    #sheet { display: grid; grid-template-columns: repeat(2, 512px); gap: 4px; }
    #sheet canvas { width: 512px; height: 288px; }
    #sheet div { position: relative; }
    #sheet span { position: absolute; left: 4px; top: 2px; color: #ff0; background: #000; }
    #info { padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="144"></canvas>
<div id="info"></div>
<div id="sheet"></div>
<script src="../js/config.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/backgrounds.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/scenario.js"></script>
<script src="../js/machine.js"></script>
<script src="../js/figures.js"></script>
<script src="../js/button.js"></script>
<script src="../js/lcd-rash.js"></script>
<script src="../js/customize.js"></script>
<script src="../js/lcd-story.js"></script>
<script src="../js/lcd.js"></script>
<script>
(() => {
    const params = new URLSearchParams(location.search);
    const screen = document.getElementById('screen').getContext('2d');
    // &fast=1: 大当たりのラウンドをすぐ終わらせる (玉が入らないので)
    if (params.get('fast')) CONFIG.machine.bonus.maxTime = params.get('promote') ? 8 : 0.5;
    if (params.get('promote')) CONFIG.show.promote.rate = 1;
    const m = Machine.create(CONFIG, params.get('spec') || 's99');
    const lcd = Lcd.init();
    const force = params.get('force') || 'hit';
    const options = { enemy: params.get('enemy') || undefined, holdColor: params.get('color') || undefined, challenge: params.get('challenge') || undefined };
    if (!['challenge', 'koori', 'onioni', 'blackout', 'renchan'].includes(params.get('force'))) {
        for (let i = 0; i < Number(params.get('holds') || 2); i++) Machine.debugHold(m, 1, 'miss', null);
    }
    if (force === 'challenge') Machine.debugChallenge(m, 4, Number(params.get('win') ?? -1));
    else if (force === 'renchan') {
        Machine.debugJitan(m);
        if (params.get('mode')) Machine.setRashMode(m, params.get('mode'));
        m.holds[1].length = 0;
        Machine.debugHold(m, 2, 'hit', null, {});          // この変動で大当たり
        const pos = Number(params.get('pos') || 1);
        for (let i = 1; i < pos; i++) m.holds[2].push({ kind: 'miss', holdColor: 'white' });
        m.holds[2].push({ kind: 'small', holdColor: 'white' });   // 残り保留の当たり
    } else if (force === 'blackout') {
        Machine.debugJitan(m);
        Machine.debugHold(m, 2, 'small', null, {});
        m.holds[2][0].force = 'blackout';
    }
    else if (force === 'koori' || force === 'onioni') {
        Machine.debugJitan(m);
        Machine.setRashMode(m, force);
        m.holds[1].length = 0;
        Machine.debugHold(m, 2, params.get('lose') ? 'reach' : params.get('hit') ? 'hit' : 'small', null, { enemy: options.enemy, pattern: params.get('pattern') || undefined });
        if (params.get('hit')) m.rush.hits = Number(params.get('hit'));   // 何連目か
        if (params.get('rashhold')) m.holds[2].push({ kind: 'small', holdColor: 'white', rashHold: params.get('rashhold') });
    } else if (force === 'small') Machine.debugHold(m, 2, 'small', null);
    else if (force === 'rush') Machine.debugHold(m, 1, 'hit', 'jitan', options);
    else Machine.debugHold(m, 1, force, null, options);
    if (params.get('change')) {
        // 保留変化の確認: 当たりの保留を白で出しておき、変化させる
        const target = params.get('change') === 'next' ? m.holds[1][1] : m.holds[1][0];
        if (target) { target.holdColor = params.get('color') || 'red'; target.shownColor = 'white'; target.change = params.get('change'); }
    }
    let time = 0;
    if (params.get('story')) Lcd.playStory(params.get('story'), 0);
    const step = dt => {
        time += dt;
        Machine.update(m, dt);
        m.events.splice(0).forEach(e => Lcd.event(e, time));
    };
    const render = () => {
        screen.imageSmoothingEnabled = false;
        screen.drawImage(Lcd.draw(time, m), 0, 0);
        const p = m.spin && m.spin.plan;
        document.getElementById('info').textContent = `t=${time.toFixed(2)}s`
            + (p ? ` / ${p.type || ''} ${p.challenge || ''} ${p.enemy || ''} ${p.win ? '勝ち' : ''} 図柄 ${p.digits.join(',')}` : '');
    };
    if (params.has('ts')) {
        document.getElementById('screen').style.display = 'none';
        params.get('ts').split(',').map(Number).forEach(target => {
            while (time < target) step(1 / 60);
            const box = document.createElement('div');
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 144;
            const g = c.getContext('2d');
            g.imageSmoothingEnabled = false;
            g.drawImage(Lcd.draw(time, m), 0, 0);
            const label = document.createElement('span');
            label.textContent = `${target}s`;
            box.append(c, label);
            document.getElementById('sheet').appendChild(box);
        });
        render();
        return;
    }
    if (params.has('t')) {
        const target = Number(params.get('t'));
        while (time < target) step(1 / 60);
        render();
        return;
    }
    let last = null;
    const frame = ts => {
        if (last !== null) step(Math.min(0.1, ts / 1000 - last));
        last = ts / 1000;
        render();
        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    document.addEventListener('keydown', e => { if (e.code === 'KeyB') Lcd.push(time); });
})();
</script>
</body>
</html>
