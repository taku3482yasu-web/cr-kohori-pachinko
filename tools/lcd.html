<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>液晶の確認</title>
<!--
    液晶だけを大きく表示して、変動の流れを確認する (盤面・玉はなし)。
    ?force=hit|rush|reach|fail|small  はじめの保留 / &enemy=onioni バトルの相手 / &spec=s159
    ?force=challenge&win=2  突破チャレンジ (保留4つ、win 番目で当たり。-1 で負け)。&extra=hit (または miss) でおまけの保留を1つ足す
    ?force=koori&enemy=goldDog&lose=1  こおりRASH のバトル (lose=1 でガセのバトル。&kai=1 で怪の保留、&revival=1 で復活。相手は aruaru・○○Kai も)
    ?force=onioni&pattern=zoom  おにおにRASH の当たり (open / rainbow / flip / upsideDown / mono / zoom / koori / tomoishi / naitei)
    &rashhold=black (または spin)  RASH 中の当たりの保留を黒い保留・回る保留に (残り保留に1つ足す)
    ?force=blackout  RASH 中のブラックアウト (突発当たり)
    ?force=koori&premium=1  RASH 中のプレミアボーナス (koori: 怪のバトル / onioni: 金面犬がとなりに座る / okapipo: ブラックアウト。役物は盤面に描くので index.html で)
    ?story=opening / ?story=ending  オープニング・エンディング
    ?force=rush&promote=1&fast=1  奇数の当たりを偶数で見せて、ラウンド中に昇格
    ?force=hit&stepup=s3gold&gizi=3  ステップアップ予告 (s1〜s3gold) と擬似連 (0〜3)
    ?force=hit&zen=okagappa  全回転 (koori / naitei / aruaru / onioni / okagappa)
    ?force=fail&yutime=1&holds=0  遊タイム (はじめの変動が止まったら遊タイム突入)
    ?force=koori&hit=2&cheer=3  こおりRASH のお仲間の応援 (0〜3人)
    ?force=hit&enemy=onioni&gun=hibiki&cutin=gold&develop=1&gimmick=1&stepup=none  群予告・SPSP への発展・こおりカットイン・役物 (役物は盤面に描くので index.html で)
    ?force=hit&notice=post  告知のタイプ (post: 後告知 / oneshot: 一発告知)
    ?force=okapipo&hit=6&oka=rainbow  おかピポRASH の当たり (lose=1 で外れ。oka=gold で金色のおかがっぱ、oka=gun で告知なしのおかがっぱ群)
    ?force=reach&pursuit=1  通常時のバトルで追撃チャンス (force=hit で勝ち)
    ?force=koori&hit=2&summon=1  こおりRASH のお仲間召喚
    ?force=koori&vpromote=1  小当たりを V 以外の図柄でそろえて、V入賞 → ラウンドの始めに V に昇格
    ?force=renchan&mode=onioni&fast=1  RASH の大当たり中に残り保留の当たりで「〇G連確定！」(&pos=2 で2つ目の保留。〇 は残り保留の当たりの数)
    ?force=koori&hit=3&fast=1  こおりRASH で特図2 の大当たり (3連目) → 大当たり → 「〇回目」→「〇〇RASH」
    &t=12 その秒数まで早送りした画面で止める (ヘッドレスChromeで画像にするとき)。t がなければふつうに動く
    &ts=2,6,12 その秒数ごとの画面を並べる (1回の変動を何枚かで見る)
    &holds=3 ほかの保留の数 / &color=rainbow はじめの保留の色 / &challenge=music チャレンジの種類
    &change=self (または next) はじめの保留を白から変化させる (当該変化 / 保留が進むとき)
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
    body { margin: 0; background: #111; color: #ccc; font: 13px monospace; }
    canvas { display: block; width: 768px; height: 432px; image-rendering: pixelated; }
    #sheet { display: grid; grid-template-columns: repeat(2, 512px); gap: 4px; }
    #sheet canvas { width: 512px; height: 288px; }
    #sheet div { position: relative; }
    #sheet span { position: absolute; left: 4px; top: 2px; color: #ff0; background: #000; }
    #info { padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="144"></canvas>
<div id="info"></div>
<div id="sheet"></div>
<script src="../js/config.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/characters.js"></script>
    <script src="../js/rivals.js?v=0"></script>
<script src="../js/backgrounds.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/scenario.js"></script>
<script src="../js/machine.js"></script>
<script src="../js/figures.js"></script>
<script src="../js/button.js"></script>
<script src="../js/lcd-rash.js"></script>
<script src="../js/customize.js"></script>
<script src="../js/round-info.js"></script>
<script src="../js/lcd-story.js"></script>
<script src="../js/lcd.js"></script>
<script>
(() => {
    const params = new URLSearchParams(location.search);
    const screen = document.getElementById('screen').getContext('2d');
    // &fast=1: 大当たりのラウンドをすぐ終わらせる (玉が入らないので)
    if (params.get('fast')) CONFIG.machine.bonus.maxTime = params.get('promote') ? 8 : 0.5;
    if (params.get('promote')) CONFIG.show.promote.rate = 1;
    if (params.get('vpromote')) CONFIG.show.promote.vRate = 1;   // 小当たりを V 以外の図柄でそろえる (V入賞も自動で)
    if (params.get('pursuit')) CONFIG.show.pursuit.hitRate = CONFIG.show.pursuit.missRate = 1;   // 通常時のバトルで必ず追撃チャンス
    if (params.get('summon')) { CONFIG.show.summon.rate = 1; CONFIG.show.revival.share = 0; }   // こおりRASH の当たりのバトルで必ずお仲間召喚 (復活にしない)
    if (params.has('cheer')) CONFIG.show.cheer.win = CONFIG.show.cheer.miss = { [params.get('cheer')]: 1 };   // こおりRASH のお仲間の応援の人数
    const m = Machine.create(CONFIG, params.get('spec') || 's99');
    if (params.get('notice')) Machine.setNotice(m, params.get('notice'));   // &notice=post / oneshot: 告知のタイプ
    const lcd = Lcd.init();
    const force = params.get('force') || 'hit';
    const options = { enemy: params.get('enemy') || undefined, holdColor: params.get('color') || undefined, challenge: params.get('challenge') || undefined };
    if (!['challenge', 'koori', 'onioni', 'okapipo', 'blackout', 'renchan'].includes(params.get('force'))) {
        for (let i = 0; i < Number(params.get('holds') || 2); i++) Machine.debugHold(m, 1, 'miss', null);
    }
    if (force === 'challenge') Machine.debugChallenge(m, 4, Number(params.get('win') ?? -1), params.get('extra'));
    else if (force === 'renchan') {
        Machine.debugJitan(m);
        if (params.get('mode')) Machine.setRashMode(m, params.get('mode'));
        m.holds[1].length = 0;
        Machine.debugHold(m, 2, 'hit', null, {});          // この変動で大当たり
        const pos = Number(params.get('pos') || 1);
        for (let i = 1; i < pos; i++) m.holds[2].push({ kind: 'miss', holdColor: 'white' });
        m.holds[2].push({ kind: 'small', holdColor: 'white' });   // 残り保留の当たり
    } else if (force === 'blackout') {
        Machine.debugJitan(m);
        Machine.debugHold(m, 2, 'small', null, {});
        m.holds[2][0].force = 'blackout';
    }
    else if (force === 'koori' || force === 'onioni' || force === 'okapipo') {
        Machine.debugJitan(m);
        Machine.setRashMode(m, force);
        m.holds[1].length = 0;
        Machine.debugHold(m, 2, params.get('lose') ? 'reach' : params.get('hit') ? 'hit' : 'small', null, { enemy: options.enemy, pattern: params.get('pattern') || undefined, premium: Boolean(params.get('premium')) });
        if (params.get('oka')) m.holds[2][0].forceOkaNotice = params.get('oka');   // &oka=gimmick: おかピポRASH の一発告知 (gold / gun / shake / voice / rainbow / gimmick)
        if (params.get('hit')) m.rush.hits = Number(params.get('hit'));   // 何連目か
        if (params.get('rashhold')) m.holds[2].push({ kind: 'small', holdColor: 'white', rashHold: params.get('rashhold') });
        // 復活: 当たりのバトルを一度負けに見せる (1/99 は 900個 の当たりにする)
        if (params.get('revival')) {
            const h = m.holds[2][0];
            h.force = 'revival';
            h.alloc = m.spec.rushHit.find(a => a.label === CONFIG.show.revival.labels[m.specId]) || m.spec.rushHit[0];
        }
        // 怪の保留 (先バレ): 怪の相手のバトルにする
        if (params.get('kai')) m.holds[2][0].kai = true;
    } else if (force === 'small') Machine.debugHold(m, 2, 'small', null);
    else if (force === 'rush') Machine.debugHold(m, 1, 'hit', 'jitan', options);
    else Machine.debugHold(m, 1, force, null, options);
    // &stepup=s3gold: ステップアップ予告 (s1 / s2 / s3white / s3red / s3gold) / &gizi=3: 擬似連の回数 / &zen=koori: 全回転 (当たりのとき)
    // &yutime=1: はじめの変動が止まったら遊タイム (force=fail などの外れと使う)
    if (params.get('yutime')) m.normalSpins = m.spec.yutime.at - 1;
    const first = m.holds[1][0];
    if (first) {
        if (params.get('stepup')) first.forceStepUp = params.get('stepup');
        if (params.has('gizi')) first.forceGizi = Number(params.get('gizi'));
        if (params.get('zen')) first.forceZenkaiten = params.get('zen');
        // &gun=koori: 群予告 (koori / onioni / hibiki) / &cutin=gold: こおりカットイン (blue / green / red / gold) / &develop=1: SPSP への発展 (enemy=onioni などと) / &gimmick=1: 盤面の役物
        if (params.get('gun')) first.forceGun = params.get('gun');
        if (params.get('cutin')) first.forceCutin = params.get('cutin');
        if (params.get('develop')) first.forceDevelop = true;
        if (params.get('gimmick')) first.forceGimmick = true;
    }
    if (params.get('change')) {
        // 保留変化の確認: 当たりの保留を白で出しておき、変化させる
        const target = params.get('change') === 'next' ? m.holds[1][1] : m.holds[1][0];
        if (target) { target.holdColor = params.get('color') || 'red'; target.shownColor = 'white'; target.change = params.get('change'); }
    }
    let time = 0;
    if (params.get('story')) Lcd.playStory(params.get('story'), 0);
    const step = dt => {
        time += dt;
        Machine.update(m, dt);
        m.events.splice(0).forEach(e => Lcd.event(e, time));
        // &vpromote=1: 小当たりのアタッカーが開いたら、すぐ V に入れる (玉がないので)
        if (params.get('vpromote') && m.small && !m.small.v) Machine.enter(m, 'attacker');
    };
    const render = () => {
        screen.imageSmoothingEnabled = false;
        screen.drawImage(Lcd.draw(time, m), 0, 0);
        const p = m.spin && m.spin.plan;
        document.getElementById('info').textContent = `t=${time.toFixed(2)}s`
            + (p ? ` / ${p.type || ''} ${p.challenge || ''} ${p.enemy || ''} ${p.win ? '勝ち' : ''} 図柄 ${p.digits.join(',')}` : '');
    };
    if (params.has('ts')) {
        document.getElementById('screen').style.display = 'none';
        params.get('ts').split(',').map(Number).forEach(target => {
            while (time < target) step(1 / 60);
            const box = document.createElement('div');
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 144;
            const g = c.getContext('2d');
            g.imageSmoothingEnabled = false;
            g.drawImage(Lcd.draw(time, m), 0, 0);
            const label = document.createElement('span');
            label.textContent = `${target}s`;
            box.append(c, label);
            document.getElementById('sheet').appendChild(box);
        });
        render();
        return;
    }
    if (params.has('t')) {
        const target = Number(params.get('t'));
        while (time < target) step(1 / 60);
        render();
        return;
    }
    let last = null;
    const frame = ts => {
        if (last !== null) step(Math.min(0.1, ts / 1000 - last));
        last = ts / 1000;
        render();
        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    document.addEventListener('keydown', e => { if (e.code === 'KeyB') Lcd.push(time); });
})();
</script>
</body>
</html>
